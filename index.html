<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>麻酔 毎日1本</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18242a; --muted:#5b6b70; --line:#d9e1df;
  --accent:#0f6b5c; --tint:#e3f0ed;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10181a; --card:#182326; --ink:#e6eeed; --muted:#97a9ac; --line:#2a393c;
    --accent:#59c2ad; --tint:#1d3330; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.75;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-family:var(--font-display);font-size:20px;margin:0}
.date{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.chip{display:inline-block;background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.card h2{font-family:var(--font-display);font-size:20px;line-height:1.5;margin:12px 0 4px}
.cite{color:var(--muted);font-size:14px;margin:0 0 16px}
.card h3{font-size:14px;color:var(--accent);margin:18px 0 4px;letter-spacing:.04em}
.card p{margin:0;max-width:65ch}
.card ul{margin:0;padding-left:1.2em;max-width:65ch}
.card li{margin-bottom:4px}
.lead{font-weight:700}
.choice{display:block;width:100%;text-align:left;margin-top:8px;line-height:1.5}
.choice.right{background:var(--tint);border-color:var(--accent);color:var(--ink);font-weight:700}
.choice.wrong{border-color:#b3261e;text-decoration:line-through}
.choice:disabled{cursor:default;opacity:1;color:var(--ink)}
.fb{margin-top:12px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>麻酔 毎日1本</h1>
    <div class="date" id="date"></div>
  </header>
  <article class="card" id="card"></article>
</div>
<script>
// 起点日。12日で全テーマを一巡し、各テーマに論文が増えると次の周回から新しい論文が出る。
var START = Date.UTC(2026, 10, 17);
var THEMES = ["気道管理","区域麻酔","産科麻酔","小児麻酔","循環管理","麻酔薬・筋弛緩","術後回復（ERAS）","術後せん妄・脳","輸液管理","集中治療・鎮静","術後悪心嘔吐","麻酔深度・モニタリング"];
var PAPERS = [];
var PER = THEMES.length;
function todayIndex(){
  var n = new Date();
  return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - START) / 86400000);
}
function paperFor(day){
  var d = ((day % PER) + PER) % PER;
  var round = Math.floor(day / PER);
  var list = PAPERS.filter(function(p){ return p.theme === d; });
  return list[((round % list.length) + list.length) % list.length];
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(day){
  var dt = new Date(START + day * 86400000);
  var w = ["日","月","火","水","木","金","土"][dt.getUTCDay()];
  return dt.getUTCFullYear() + "/" + (dt.getUTCMonth()+1) + "/" + dt.getUTCDate() + "（" + w + "）";
}
function list(items){ return '<ul>' + items.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join("") + '</ul>'; }
function render(){
  var card = document.getElementById("card");
  if (!PAPERS.length) { card.innerHTML = '<p>論文データを読み込めませんでした。ページを開き直してください。</p>'; return; }
  var day = todayIndex();
  var p = paperFor(day);
  document.getElementById("date").textContent = fmt(day);
  card.innerHTML = '<span class="chip">' + esc(THEMES[p.theme]) + '</span>' +
    '<h2>' + esc(p.title) + '</h2><p class="cite">' + esc(p.cite) + '</p>' +
    '<h3>今日の問い</h3><p class="lead">' + esc(p.question) + '</p>' +
    '<h3>背景</h3><p>' + esc(p.background) + '</p>' +
    '<h3>方法</h3><p>' + esc(p.design) + '</p>' +
    '<h3>結果</h3>' + list(p.findings) +
    '<h3>限界</h3>' + list(p.limits) +
    '<h3>臨床での意味</h3><p class="lead">' + esc(p.meaning) + '</p>' +
    '<h3>確認クイズ</h3><div class="quiz" id="quiz"></div>' +
    '<div class="actions"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">原著を開く（PubMed）</a></div>' +
    '<p class="note">要約はAIが作成しました。診療に使う前に、必ず原著で数値を確認してください。</p>';
  quiz(p);
}
function quiz(p){
  var q = p.quiz, box = document.getElementById("quiz");
  if (!q || !box) return;
  box.innerHTML = '<p class="lead">' + esc(q.q) + '</p>' +
    q.choices.map(function(c, i){ return '<button type="button" class="choice" data-i="' + i + '">' + esc(c) + '</button>'; }).join("") +
    '<p class="fb" id="fb" role="status"></p>';
  Array.prototype.forEach.call(box.querySelectorAll(".choice"), function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-i"), ok = i === q.answer;
      Array.prototype.forEach.call(box.querySelectorAll(".choice"), function(x){
        x.disabled = true;
        if (+x.getAttribute("data-i") === q.answer) x.className += " right";
      });
      if (!ok) b.className += " wrong";
      document.getElementById("fb").textContent = (ok ? "正解。" : "不正解。") + q.explain;
    };
  });
}
fetch("papers.json").then(function(r){ return r.json(); }).then(function(d){ PAPERS = d; render(); }).catch(function(){ render(); });
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
</body>
</html>
