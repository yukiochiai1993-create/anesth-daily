<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>麻酔 毎日1本</title>
<style>
/* 配色: 手術室のグリーンを基調にした落ち着いた配色 / レイアウト: 1カラムのカード + 下に12テーマ一覧 */
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18242a; --muted:#5b6b70; --line:#d9e1df;
  --accent:#0f6b5c; --accent-ink:#ffffff; --tint:#e3f0ed;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181a; --card:#182326; --ink:#e6eeed; --muted:#97a9ac; --line:#2a393c;
    --accent:#59c2ad; --accent-ink:#0a1a17; --tint:#1d3330; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10181a; --card:#182326; --ink:#e6eeed; --muted:#97a9ac; --line:#2a393c;
  --accent:#59c2ad; --accent-ink:#0a1a17; --tint:#1d3330; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.75;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-family:var(--font-display);font-size:20px;margin:0;text-wrap:balance}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.nav button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.chip{display:inline-block;background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.badge{font-size:13px;color:var(--muted);margin-left:8px}
.card h2{font-family:var(--font-display);font-size:20px;line-height:1.5;margin:12px 0 4px;text-wrap:balance}
.cite{color:var(--muted);font-size:14px;margin:0 0 16px}
.card h3{font-size:14px;color:var(--accent);margin:18px 0 4px;letter-spacing:.04em}
.card p{margin:0;max-width:65ch}
.card ul{margin:0;padding-left:1.2em;max-width:65ch}
.card li{margin-bottom:4px}
.lead{font-weight:700}
.choice{display:block;width:100%;text-align:left;margin-top:8px;line-height:1.5}
.choice.right{background:var(--tint);border-color:var(--accent);color:var(--ink);font-weight:700}
.choice.wrong{border-color:#b3261e;text-decoration:line-through}
.choice:disabled{cursor:default;opacity:1;color:var(--ink)}
.fb{margin-top:12px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:16px}
.list{margin-top:28px}
.list h2{font-size:15px;margin:0 0 8px;font-family:var(--font-display)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px}
.row .n{font-variant-numeric:tabular-nums;color:var(--muted);width:2em}
.row .t{flex:1}
.row .done{color:var(--accent);font-weight:700}
.row.cur{border-color:var(--accent);background:var(--tint)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.grp{margin-bottom:18px}
.grp h2{font-size:15px;margin:0 0 6px;font-family:var(--font-display)}
.grp .empty{color:var(--muted);font-size:14px;margin:0}
.row .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.back{margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{min-height:40px;padding:6px 12px}
.filters button[aria-pressed=true]{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:700}
.mk{font-weight:700;color:var(--accent);min-width:1.2em}
.mk.bad{color:#b3261e}
.favb[aria-pressed=true]{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:700}
.actions button{min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>麻酔 毎日1本</h1>
    <div class="date" id="date"></div>
  </header>
  <p class="note" id="streak" style="margin:0 0 10px"></p>
  <div class="tabs"><button type="button" id="tabToday" aria-pressed="true">今日の1本</button><button type="button" id="tabBack" aria-pressed="false">バックナンバー</button></div>
  <article class="card" id="card"></article>
  <div id="back" hidden></div>
</div>

<script>
// 起点日: この日が「1日目」。12日で全テーマを一巡し、各テーマに論文を足すと次の周回から新しい論文が出る。
var START = Date.UTC(2026, 10, 17);

var THEMES = ["気道管理","区域麻酔","産科麻酔","小児麻酔","循環管理","麻酔薬・筋弛緩","術後回復（ERAS）","術後せん妄・脳","輸液管理","集中治療・鎮静","術後悪心嘔吐","麻酔深度・モニタリング"];

var PAPERS = [];

var PER = THEMES.length;

var S = {open:{}, quiz:{}, fav:{}};
try { var raw = localStorage.getItem("anesthDaily1"); if (raw) { var o = JSON.parse(raw); S.open = o.open || {}; S.quiz = o.quiz || {}; S.fav = o.fav || {}; } } catch(e) {}
function save(){ try { localStorage.setItem("anesthDaily1", JSON.stringify(S)); } catch(e) {} }
function streak(today){ var n = 0; while (S.open[today - n]) n++; return n; }
var FILTER = "all";

function todayIndex(){
  var n = new Date();
  return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - START) / 86400000);
}
function paperFor(day){
  var d = ((day % PER) + PER) % PER;          // 今日のテーマ番号
  var round = Math.floor(day / PER);           // 何周目か
  var list = PAPERS.filter(function(p){ return p.theme === d; });
  return list[((round % list.length) + list.length) % list.length];
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(day){
  var dt = new Date(START + day * 86400000);
  var w = ["日","月","火","水","木","金","土"][dt.getUTCDay()];
  return dt.getUTCFullYear() + "/" + (dt.getUTCMonth()+1) + "/" + dt.getUTCDate() + "（" + w + "）";
}

function list(items){ return '<ul>' + items.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join("") + '</ul>'; }
function render(dayArg){
  var card = document.getElementById("card");
  if (!PAPERS.length) { card.innerHTML = '<p>論文データを読み込めませんでした。ページを開き直してください。</p>'; return; }
  var isToday = (typeof dayArg !== "number");
  var day = isToday ? todayIndex() : dayArg;
  var p = paperFor(day);
  if (isToday) { S.open[day] = 1; save(); document.getElementById("streak").textContent = "連続 " + streak(day) + " 日"; }
  document.getElementById("date").textContent = fmt(day);
  card.innerHTML = '<span class="chip">' + esc(THEMES[p.theme]) + '</span>' +
    '<h2>' + esc(p.title) + '</h2><p class="cite">' + esc(p.cite) + '</p>' +
    '<h3>問い</h3><p class="lead">' + esc(p.question) + '</p>' +
    '<h3>背景</h3><p>' + esc(p.background) + '</p>' +
    '<h3>方法</h3><p>' + esc(p.design) + '</p>' +
    '<h3>結果</h3>' + list(p.findings) +
    '<h3>限界</h3>' + list(p.limits) +
    '<h3>臨床での意味</h3><p class="lead">' + esc(p.meaning) + '</p>' +
    '<h3>確認クイズ</h3><div class="quiz" id="quiz"></div>' +
    '<div class="actions"><button type="button" class="favb" id="favb" aria-pressed="' + (S.fav[p.title] ? "true" : "false") + '">' + (S.fav[p.title] ? "★ お気に入り済み" : "☆ お気に入りに入れる") + '</button><a href="' + esc(p.url) + '" target="_blank" rel="noopener">原著を開く（PubMed）</a></div>' +
    '<p class="note">要約はAIが作成しました。診療に使う前に、必ず原著で数値を確認してください。</p>';
  document.getElementById("favb").onclick = function(){
    if (S.fav[p.title]) delete S.fav[p.title]; else S.fav[p.title] = 1;
    save(); var on = !!S.fav[p.title];
    this.setAttribute("aria-pressed", on ? "true" : "false");
    this.textContent = on ? "★ お気に入り済み" : "☆ お気に入りに入れる";
  };
  quiz(p);
}
function quiz(p){
  var q = p.quiz, box = document.getElementById("quiz");
  if (!q || !box) return;
  box.innerHTML = '<p class="lead">' + esc(q.q) + '</p>' +
    q.choices.map(function(c, i){ return '<button type="button" class="choice" data-i="' + i + '">' + esc(c) + '</button>'; }).join("") +
    '<p class="fb" id="fb" role="status"></p>';
  Array.prototype.forEach.call(box.querySelectorAll(".choice"), function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-i"), ok = i === q.answer;
      Array.prototype.forEach.call(box.querySelectorAll(".choice"), function(x){
        x.disabled = true;
        if (+x.getAttribute("data-i") === q.answer) x.className += " right";
      });
      if (!ok) b.className += " wrong";
      S.quiz[p.title] = ok ? 1 : 0; save();
      document.getElementById("fb").textContent = (ok ? "正解。" : "不正解。") + q.explain;
    };
  });
}

function showTab(name){
  var b = name === "back";
  document.getElementById("tabToday").setAttribute("aria-pressed", b ? "false" : "true");
  document.getElementById("tabBack").setAttribute("aria-pressed", b ? "true" : "false");
  document.getElementById("card").hidden = b;
  document.getElementById("back").hidden = !b;
  if (b) renderBack(); else render();
  window.scrollTo(0, 0);
}
function renderBack(){
  var box = document.getElementById("back"), today = todayIndex(), seen = {}, by = {}, total = 0, done = 0;
  for (var d = 0; d <= today; d++) {
    var p = paperFor(d); if (!p || seen[p.title]) continue;
    seen[p.title] = 1; total++; if (S.quiz[p.title] === 1) done++;
    if (FILTER === "fav" && !S.fav[p.title]) continue;
    if (FILTER === "wrong" && S.quiz[p.title] !== 0) continue;
    (by[p.theme] = by[p.theme] || []).push({d: d, p: p});
  }
  var names = {all: "すべて", fav: "★ お気に入り", wrong: "間違えたクイズ"};
  var html = '<p class="note" style="margin:0 0 8px">表示済み ' + total + ' 本 ／ クイズ正解 ' + done + ' 本</p><div class="filters">';
  ["all", "fav", "wrong"].forEach(function(k){
    html += '<button type="button" data-f="' + k + '" aria-pressed="' + (FILTER === k ? "true" : "false") + '">' + names[k] + '</button>';
  });
  html += '</div>';
  THEMES.forEach(function(t, i){
    var items = by[i] || [];
    html += '<section class="grp"><h2>' + esc(t) + '（' + items.length + '）</h2>';
    if (!items.length) html += '<p class="empty">' + (FILTER === "all" ? "まだありません" : "該当なし") + '</p>';
    items.forEach(function(it){
      var q = S.quiz[it.p.title], mk = q === 1 ? '<span class="mk">✓</span>' : (q === 0 ? '<span class="mk bad">✗</span>' : '<span class="mk"></span>');
      html += '<button type="button" class="row" data-d="' + it.d + '">' + mk + '<span class="t">' + (S.fav[it.p.title] ? "★ " : "") + esc(it.p.title) + '</span><span class="d">' + fmt(it.d) + '</span></button>';
    });
    html += '</section>';
  });
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll(".row"), function(b){
    b.onclick = function(){ openPast(+b.getAttribute("data-d")); };
  });
  Array.prototype.forEach.call(box.querySelectorAll(".filters button"), function(b){
    b.onclick = function(){ FILTER = b.getAttribute("data-f"); renderBack(); };
  });
}
function openPast(day){
  document.getElementById("back").hidden = true;
  document.getElementById("card").hidden = false;
  render(day);
  var c = document.getElementById("card");
  var bt = document.createElement("button"); bt.type = "button"; bt.className = "back"; bt.textContent = "← バックナンバーに戻る";
  bt.onclick = function(){ showTab("back"); };
  c.insertBefore(bt, c.firstChild);
  window.scrollTo(0, 0);
}
document.getElementById("tabToday").onclick = function(){ showTab("today"); };
document.getElementById("tabBack").onclick = function(){ showTab("back"); };
fetch("papers.json").then(function(r){ return r.json(); }).then(function(d){ PAPERS = d; render(); }).catch(function(){ render(); });
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
</body>
</html>
